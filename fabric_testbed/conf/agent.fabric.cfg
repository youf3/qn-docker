# FABRIC native agent overrides merged on top of ../../conf/agent.cfg
# Dynamic per-node network fields (mq.host, ip, base_port, peer_ips) are populated at staging time.
[common]
logdir = /home/rocky/qncp/logs

[link]
hello_interval = 10
hold_time = 30

[interpreters]
path = /home/rocky/qncp/src/qn-plugins/plugins/pingpong/interpreter

[schemas]
path = /home/rocky/qncp/src/qn-plugins/plugins/schema

[devices]
[[lightsource]]
enabled = true
type = Light_Source
driver = DummyLightSrc

[[signalmeasurement]]
enabled = true
type = Signal_Measurement
driver = DummySignalMeasurement
window = 2.0
resolution = 1e-7

[tasks]
[[downhill_calibration1]]
path = /home/rocky/qncp/src/qn-agent/config/downhill_calibration1.json

[[downhill_calibration2]]
path = /home/rocky/qncp/src/qn-agent/config/downhill_calibration2.json

[[downhill_calibration3]]
path = /home/rocky/qncp/src/qn-agent/config/downhill_calibration3.json

[[downhill_calibration4]]
path = /home/rocky/qncp/src/qn-agent/config/downhill_calibration4.json
