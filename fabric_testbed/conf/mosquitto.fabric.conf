# Dual-stack IPv4/IPv6 Mosquitto configuration for FABRIC controller VM (network_mode: host).
# Omitting bind addresses on listener directives allows both FABNetv6 IPv6 agents and 127.0.0.1 local services.
listener 1883
allow_anonymous true

listener 8080
protocol websockets
allow_anonymous true

connection_messages true
log_timestamp true

# Allow large MQTT packets (e.g. DQC requests with many commands)
max_packet_size 268435455
